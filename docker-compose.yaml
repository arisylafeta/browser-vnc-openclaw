# EasyClaw Browser-VNC Template
# Provides OpenClaw with dedicated VNC-enabled browser
#
# Access via Tailscale backend proxy only - no public port exposure
# Backend connects to: http://{tailscale-ip}:{port}

services:
  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    restart: on-failure:5
    expose:
      - "${OPENCLAW_GATEWAY_PORT:-18789}"
    env_file:
      - .env
    environment:
      # Docker proxy connection (REQUIRED for sandboxing)
      DOCKER_HOST: tcp://docker-proxy:2375
      
      # Port configuration
      PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      
      # Basic config
      NODE_ENV: production
      HOME: /data
      
      # Workspace paths
      OPENCLAW_STATE_DIR: /data/.openclaw
      OPENCLAW_WORKSPACE: /data/openclaw-workspace
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND:-lan}
      
      # Gateway authentication
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      
      # AI provider API keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      
      # Optional integrations
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USERNAME: ${GITHUB_USERNAME:-}
      GITHUB_EMAIL: ${GITHUB_EMAIL:-}
      
      # VNC configuration (passed to bootstrap)
      NOVNC_PORT: ${NOVNC_PORT:-6080}
      VNC_PASSWORD: ${VNC_PASSWORD}
      
      # Bootstrap flags
      OPENCLAW_AUTO_BOOTSTRAP: "1"
      OPENCLAW_PRINT_ACCESS: "1"

    volumes:
      - type: bind
        source: /data/coolify/applications/${CONTAINER_ID}/data
        target: /data
        is_directory: true
      - type: bind
        source: /data/coolify/applications/${CONTAINER_ID}/workspace
        target: /data/openclaw-workspace
        is_directory: true

    depends_on:
      - docker-proxy
      - browser-vnc

    command: ["bash", "/app/scripts/bootstrap.sh"]
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OPENCLAW_GATEWAY_PORT:-18789}/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      VERSION: 1
      EXEC: 1

  browser-vnc:
    build:
      context: .
      dockerfile: Dockerfile.browser-vnc
    restart: unless-stopped
    expose:
      - "6080"
      - "5900"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Note: read_only removed because Chrome needs to write to its profile directory
    # for DevTools protocol to work properly on 0.0.0.0
    environment:
      # Port configuration - FIXED internal ports
      # (docker-compose maps external ports to these)
      CDP_PORT: 9222
      VNC_PORT: 5900
      NOVNC_PORT: 6080
      ENABLE_NOVNC: "1"
      HEADLESS: "0"
      
      # VNC password (critical - must be passed from Coolify)
      VNC_PASSWORD: ${VNC_PASSWORD}
      
    volumes:
      - type: bind
        source: /data/coolify/applications/${CONTAINER_ID}/browser-config
        target: /home/sandbox/.config/chromium
        is_directory: true
      - type: bind
        source: /data/coolify/applications/${CONTAINER_ID}/browser-downloads
        target: /home/sandbox/Downloads
        is_directory: true
    
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://localhost:6080/vnc.html"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

